# Git-хуки ЛР1 (https://pre-commit.com).
# Конфиг лежит в lab_1, поэтому хуки ставятся командой `make precommit`,
# а проверяются только файлы из lab_1 — остальной репозиторий не затрагивается.
#
#   pre-commit — быстрые проверки изменённых файлов (ruff, гигиена файлов);
#   pre-push   — полный набор: ruff по всему lab_1, pyright и сквозной прогон.
#                Использует .venv из lab_1, создаётся командой `make install`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
files: ^lab_1/
exclude: ^lab_1/(keys/|encrypted\.bin$|decrypted\.txt$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: make-lint
        name: ruff check + format --check (весь lab_1)
        entry: make -C lab_1 lint format-check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: make-typecheck
        name: pyright strict
        entry: make -C lab_1 typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: make-test
        name: сквозной прогон gen -> enc -> dec
        entry: make -C lab_1 test
        language: system
        pass_filenames: false
        stages: [pre-push]
