# Настройки инструментов качества кода для ЛР1.
# Все пути считаются от каталога lab_1, остальная часть репозитория не затрагивается.

[project]
name = "hybrid-cryptosystem"
version = "1.0.0"
description = "Гибридная криптосистема RSA + 3DES (исходный код из isb-2026, lab3_var22)"
requires-python = ">=3.12"
dependencies = ["cryptography==46.0.7"]

[tool.ruff]
target-version = "py312"
line-length = 79
src = ["."]
extend-exclude = [".venv", "keys"]

[tool.ruff.lint]
# Набор правил подобран так, чтобы ловить не только стиль (PEP 8),
# но и потенциальные ошибки, проблемы безопасности и отсутствие аннотаций.
select = [
    "F",     # pyflakes: неиспользуемые импорты/переменные, неопределённые имена
    "E",     # pycodestyle: ошибки PEP 8
    "W",     # pycodestyle: предупреждения PEP 8
    "C90",   # mccabe: цикломатическая сложность
    "I",     # isort: порядок импортов
    "N",     # pep8-naming: имена
    "D",     # pydocstyle: докстринги
    "UP",    # pyupgrade: современный синтаксис
    "ANN",   # flake8-annotations: аннотации типов
    "ASYNC", # flake8-async
    "S",     # flake8-bandit: безопасность
    "BLE",   # flake8-blind-except: перехват голого Exception
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear: вероятные баги
    "A",     # flake8-builtins: затенение встроенных имён
    "C4",    # flake8-comprehensions
    "EM",    # flake8-errmsg: текст исключения в отдельной переменной
    "ISC",   # flake8-implicit-str-concat
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib: pathlib вместо os.path/open
    "ERA",   # eradicate: закомментированный код
    "PL",    # pylint
    "TRY",   # tryceratops: работа с исключениями
    "PERF",  # perflint
    "FURB",  # refurb
    "RUF",   # правила самого ruff
]
ignore = [
    # Сообщения и докстринги на русском: кириллические «с», «о», «р» и т.п.
    # ruff считает похожими на латинские буквы.
    "RUF001",
    "RUF002",
    "RUF003",
    # Конфликтует с форматтером ruff (см. документацию ruff format).
    "ISC001",
    # Однострочный summary в докстрингах проекта пишется со второй строки
    # (стиль D213), поэтому противоположное правило D212 отключено.
    "D212",
    # Программа консольная: вывод хода работы через print — это её интерфейс.
    "T201",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10

[tool.ruff.lint.isort]
known-first-party = ["io_utils", "rsa_crypto", "tdes_crypto"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.pyright]
include = ["."]
exclude = [".venv", "**/__pycache__", "keys"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Сверх strict: ловим обращения к устаревшему API и лишние type: ignore.
reportDeprecated = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportMissingModuleSource = "error"
